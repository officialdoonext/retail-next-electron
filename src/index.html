<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https: blob:;
      connect-src 'self' https: wss:;
    "
  />
  <title>Retail Next — Retail Management & POS Desktop Platform</title>
  <meta name="description" content="Retail Next — Professional Modern Retail ERP & POS Desktop Platform" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <div class="app-shell">

    <!-- ── 1. Collapsible Sidebar Accordion Navigation ────────────────────── -->
    <aside class="app-sidebar" id="app-sidebar">
      <!-- Injected by SidebarNav -->
    </aside>

    <!-- ── 2. Main Content Viewport ──────────────────────────────────────── -->
    <div class="app-main">
      
      <!-- Top Application Header Bar -->
      <header class="app-header" id="app-header">
        <!-- Injected by HeaderBar -->
      </header>

      <!-- Central Workspace Outlet for Routed Pages -->
      <main class="workspace-outlet" id="workspace-outlet">
        <!-- Rendered Page View -->
      </main>

      <!-- Bottom Desktop Status Bar -->
      <footer class="app-statusbar" id="app-statusbar" role="contentinfo">
        <div class="statusbar-left">
          <div class="statusbar-item" id="statusbar-api">
            <span style="color:#10b981;">● Online: retailnext.doonext.app</span>
          </div>
          <div class="statusbar-item">
            <span>Branch: <strong id="statusbar-store">Main Retail Store</strong></span>
          </div>
          <div class="statusbar-item">
            <span>Cashier: <strong id="statusbar-cashier">Rahul Kumar</strong></span>
          </div>
        </div>

        <div class="statusbar-right">
          <div class="statusbar-item">
            <span class="badge badge-purple" style="font-size:10px;padding:2px 6px;">Strict PAGE_SIZE = 24</span>
          </div>
          <div class="statusbar-item">
            <span>Retail Next v1.0.0</span>
          </div>
          <div class="statusbar-item" style="font-family:var(--font-mono);font-weight:600;">
            <span id="statusbar-clock">--:--:--</span>
          </div>
        </div>
      </footer>

    </div>

  </div>

  <!-- ── Application Scripts ──────────────────────────────────────────────── -->
  <script src="./js/config.js"></script>
  <script src="./js/services/apiService.js"></script>
  <script src="./js/services/escposService.js"></script>
  <script src="./js/services/printerService.js"></script>
  
  <!-- UI Components -->
  <script src="./js/components/toast.js"></script>
  <script src="./js/components/receiptModal.js"></script>
  <script src="./js/components/thermalPrinterModal.js"></script>
  <script src="./js/components/authModal.js"></script>
  <script src="./js/components/storeSwitcherModal.js"></script>
  <script src="./js/components/globalSearch.js"></script>
  <script src="./js/components/sidebarNav.js"></script>
  <script src="./js/components/headerBar.js"></script>

  <!-- Auth & Routed Business Manager Pages -->
  <script src="./js/pages/loginPage.js"></script>
  <script src="./js/pages/dashboardPage.js"></script>
  <script src="./js/pages/posBillingPage.js"></script>
  <script src="./js/pages/storesPage.js"></script>

  <!-- Sales Manager -->
  <script src="./js/pages/salesInvoicesPage.js"></script>
  <script src="./js/pages/employeeSalesPage.js"></script>
  <script src="./js/pages/counterSalesPage.js"></script>

  <!-- Product Manager -->
  <script src="./js/pages/categoriesPage.js"></script>
  <script src="./js/pages/variationsPage.js"></script>
  <script src="./js/pages/productsCatalogPage.js"></script>
  <script src="./js/pages/barcodeGeneratorPage.js"></script>

  <!-- Return & Exchange Manager -->
  <script src="./js/pages/returnsPage.js"></script>
  <script src="./js/pages/exchangesPage.js"></script>

  <!-- Stock Manager -->
  <script src="./js/pages/warehouseStockPage.js"></script>
  <script src="./js/pages/storeStockPage.js"></script>
  <script src="./js/pages/stockTransfersPage.js"></script>

  <!-- Customer Manager -->
  <script src="./js/pages/customersDirectoryPage.js"></script>
  <script src="./js/pages/customer360Page.js"></script>

  <!-- Discount Manager -->
  <script src="./js/pages/orderCouponsPage.js"></script>
  <script src="./js/pages/productCouponsPage.js"></script>
  <script src="./js/pages/customerCouponsPage.js"></script>

  <!-- Vendors Manager -->
  <script src="./js/pages/vendorsDirectoryPage.js"></script>
  <script src="./js/pages/purchaseOrdersPage.js"></script>
  <script src="./js/pages/vendorInvoicesPage.js"></script>
  <script src="./js/pages/vendorDuesPage.js"></script>

  <!-- Staff Manager -->
  <script src="./js/pages/staffManagerPage.js"></script>

  <!-- Employee HR Manager -->
  <script src="./js/pages/employeeDirectoryPage.js"></script>
  <script src="./js/pages/attendancePage.js"></script>
  <script src="./js/pages/payrollPage.js"></script>
  <script src="./js/pages/idCardsPage.js"></script>
  <script src="./js/pages/leavesPage.js"></script>
  <script src="./js/pages/advancesPage.js"></script>

  <!-- Router & Bootstrap -->
  <script src="./js/router.js"></script>
  <script src="./js/app.js"></script>

</body>
</html>
